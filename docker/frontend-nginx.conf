server {
    # 8080 statt 80: der nginx läuft unprivilegiert (siehe Dockerfile.frontend).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://motorrad-routenplaner-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Routing über mehrere Abschnitte kann dauern: je Teilstrecke ruft das
        # Backend BRouter dreimal auf (Hauptroute plus zwei Alternativen). Eine
        # lange Strecke mit kurvigem Profil sprengte die vorherigen 120 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
